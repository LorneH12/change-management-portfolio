gClFFwJ+ekIGQO00u2Ki/LXYNwMhDIeyeBGeZoAPmh3exQjkc6rKdmjcZtLI3J54WzUMEagnean2/wYmzHlJ/kR96G6NJQnnVhPmLAx/Odtj/VQibXOR0CXZwKNpxgJ8KE977g6LCUAKnNu1vYnKMMjzMtzvH6njbUvn1+jI6syoINi+zgiZ/W7p+iMWpqf6IO1rRj6I9cArZZ/jIKMxTVHY6AodYOpaSjVWG6ARWteDmCxhhJ+OF/jISJfFO1naSHKRWCyAnWZB18X57/5luoEtJu1QAZfAoTC6N516Nl95id6ksq/KSyMVNQGfd9Y9x9oDJj412R8UsqYrlRrQo6QQmqN9pOLDQxac21TM7Edo51N7G+5IS1JKB8vGQAG9EwKV4j2kV9bQW1TAKakn9ua2mhid7WXfXzDV4oxufOQ1KYZSFpuZAAAAA\" width=\"650\"/><figcaption>PEOPLE. ADOPTION. LASTING RESULTS.</figcaption></figure></section>\n<div class=\"focus-strip\"><div class=\"wrap\"><span>Change readiness</span><b aria-hidden=\"true\">/</b><span>Stakeholder engagement</span><b aria-hidden=\"true\">/</b><span>Learning strategy</span><b aria-hidden=\"true\">/</b><span>Training analytics</span></div></div>\n<section aria-label=\"Jira migration program scope\" class=\"impact wrap\"><div><strong>60,000</strong><span>Impacted users</span></div><div><strong>59</strong><span>Live sessions across six global time zones</span></div><div><strong>7 personas</strong><span>Three-month migration program</span></div><p>American Express · Jira Data Center and Rally to Jira Cloud</p></section>\n<section class=\"work wrap\" id=\"work\"><div class=\"section-heading\"><div><p class=\"eyebrow\">SELECTED WORK</p><h2>Enterprise change.<br/>Evidence in practice.</h2></div><p>Explore enterprise change experience, learning journeys, and interactive demonstrations. Portfolio samples are labeled separately from professional project experience.</p></div><div class=\"project-controls\" hidden=\"\"><div aria-label=\"Filter work samples\" class=\"filter-buttons\" role=\"group\"><button aria-pressed=\"true\" data-filter=\"all\" type=\"button\">All work</button><button aria-pressed=\"false\" data-filter=\"strategy\" type=\"button\">Learning strategy</button><button aria-pressed=\"false\" data-filter=\"interactive\" type=\"button\">Interactive learning</button><button aria-pressed=\"false\" data-filter=\"media\" type=\"button\">Video &amp; media</button></div><p aria-live=\"polite\" id=\"project-count\" role=\"status\">9 projects</p></div><div class=\"project-grid\" id=\"project-grid\"><article class=\"project\" data-category=\"strategy\"><div class=\"project-cover rollout\"><div class=\"cover-meta\"><span>AMERICAN EXPRESS</span><span>ENTERPRISE CHANGE</span></div><h3>Global change.<br/>Practical enablement.</h3><p class=\"project-tools\">60,000 impacted users · 7 personas · 3 months<br/>59 live sessions · 6 global time zones</p><p class=\"cover-footer\">JIRA DATA CENTER &amp; RALLY → JIRA CLOUD</p></div><div class=\"project-copy\"><span class=\"tag\">Flagship project</span><h3>Jira Cloud migration</h3><p>Worked within a cross-functional team supporting a global migration. Personally produced training videos and PowerPoint decks, hosted live sessions, and owned analytics and communication of findings to stakeholders and executives.</p><details><summary>Scope and related initiatives <span aria-hidden=\"true\">+</span></summary><div class=\"detail\"><h4>Global delivery</h4><p>The program delivered 59 live sessions over three months across US West, US East, Manila, New Delhi, Sydney, and London, supporting seven personas. Responsibilities also included resource management, cross-team partnership, messaging, and collaboration with communications teams.</p><h4>Broader American Express portfolio</h4><ul><li>Confluence Data Center to Confluence Cloud — 20,000 impacted users.</li><li>Data center transfer — 10,000 impacted users.</li><li>SAP Fieldglass — 20,000 impacted users.</li><li>AI socialization — Rovo, Copilot, ChatGPT, and Claude, focused on plugins and streamlining work.</li></ul><p>Similar training, content, hosting, and analytics responsibilities across these initiatives, with scope varying by project. Jira had the largest impacted population.</p><h4>Tools</h4><p>Camtasia; Adobe Creative Suite for image, audio, and video editing; PowerPoint; Webex meetings and webinars; Slack for cross-team communication.</p><p class=\"note\">Project scope figures supplied by Lorne Hopkins. Impacted users describe the program population, not verified training attendance or measured adoption outcomes.</p></div></details></div></article><article class=\"project\" data-category=\"strategy\"><div class=\"project-cover rollout\"><div class=\"cover-meta\"><span>FEATURED CASE STUDY</span><span>01</span></div><h3>From a binder to a learning journey.</h3><p class=\"project-tools\">ADDIE, SAM, Bloom’s taxonomy, Kirkpatrick, Articulate, Cornerstone</p><p class=\"cover-footer\">LEARNING STRATEGY · INSTRUCTIONAL DESIGN</p></div><div class=\"project-copy\"><span class=\"tag\">Case study</span><h3>Schwab learning journey</h3><p>A digital onboarding case study that restructures a 200+ page training binder into role-based learning and ongoing performance support.</p><a class=\"text-link\" href=\"https://github.com/LorneH12/Schwab-Learning-Journey\" rel=\"noopener noreferrer\" target=\"_blank\">Read the case study ↗</a><details><summary>Design approach <span aria-hidden=\"true\">+</span></summary><div class=\"detail\"><h4>Understand the work</h4><p>Organize learning around role-specific tasks, sequence practice and reference materials, and plan reinforcement at 30, 60, and 90 days. The case study connects learning design with readiness and application on the job.</p></div></details></div></article><article class=\"project\" data-category=\"interactive\"><div class=\"project-cover measurement\"><div class=\"cover-meta\"><span>INTERACTIVE SAMPLE</span><span>02</span></div><h3>Make complex processes usable.</h3><p class=\"project-tools\">Multilingual delivery, progress tracking, workflow navigation</p><p class=\"cover-footer\">OPERATIONAL TRAINING · PERFORMANCE SUPPORT</p></div><div class=\"project-copy\"><span class=\"tag\">Portfolio sample</span><h3>Carvana inspection training</h3><p>A sample learning experience inspired by the 150-point vehicle inspection process, covering standards, reconditioning flow, quality, and safety.</p><a class=\"text-link\" href=\"https://lorneh12.github.io/carvana-150point-inspection/\" rel=\"noopener noreferrer\" target=\"_blank\">Launch training sample ↗</a><details><summary>Design approach <span aria-hidden=\"true\">+</span></summary><div class=\"detail\"><h4>Design for the moment of need</h4><p>Connect inspection standards to the workflow, provide clear navigation, and support English, Spanish, and Mandarin audiences. This is a representative capability sample.</p></div></details></div></article><article class=\"project\" data-category=\"interactive\"><div class=\"project-cover rollout\"><div class=\"cover-meta\"><span>INTERACTIVE SAMPLE</span><span>03</span></div><h3>Build confidence, step by step.</h3><p class=\"project-tools\">English, Spanish, Mandarin, Hindi · Knowledge checks</p><p class=\"cover-footer\">CUSTOMER EDUCATION · ACCESSIBLE LEARNING</p></div><div class=\"project-copy\"><span class=\"tag\">Portfolio sample</span><h3>Intuit TurboTax customer training</h3><p>A customer education demonstration with guided objectives, product benefits, knowledge checks, and a completion experience.</p><a class=\"text-link\" href=\"https://lorneh12.github.io/Intuit-TurboTax-Customer_-Training/\" rel=\"noopener noreferrer\" target=\"_blank\">Launch training sample ↗</a><details><summary>Design approach <span aria-hidden=\"true\">+</span></summary><div class=\"detail\"><h4>Reduce the learning barrier</h4><p>Introduce the purpose of the tool, guide learners through essential concepts, and check understanding before completion. Language choices and a structured flow support a broad audience.</p></div></details></div></article><article class=\"project\" data-category=\"media\"><div class=\"project-cover measurement\"><div class=\"cover-meta\"><span>VIDEO LEARNING</span><span>04</span></div><h3>A practical library of learning.</h3><p class=\"project-tools\">English, French, Spanish, Arabic · Analytics dashboard structure</p><p class=\"cover-footer\">VIDEO LEARNING · LEARNING EXPERIENCE DESIGN</p></div><div class=\"project-copy\"><span class=\"tag\">Portfolio sample</span><h3>Schwab video training samples</h3><p>A collection of 13 configured video entries in a multilingual learning interface with light and dark display options.</p><a class=\"text-link\" href=\"https://github.com/LorneH12/Schwab-Video-Training-Samples\" rel=\"noopener noreferrer\" target=\"_blank\">Explore the video project ↗</a><details><summary>Design approach <span aria-hidden=\"true\">+</span></summary><div class=\"detail\"><h4>Make learning easy to revisit</h4><p>Bring video resources into an organized experience that helps learners return to material when they need it. The build includes a structure for tracking engagement through a dashboard and Google Sheets.</p></div></details></div></article><article class=\"project\" data-category=\"interactive\"><div class=\"project-cover rollout\"><div class=\"cover-meta\"><span>SCENARIO-BASED LEARNING</span><span>05</span></div><h3>Practice decisions. See consequences.</h3><p class=\"project-tools\">PowerPoint, Articulate Storyline, TalentLMS</p><p class=\"cover-footer\">SCENARIO DESIGN · ADAPTIVE FEEDBACK</p></div><div class=\"project-copy\"><span class=\"tag\">Portfolio sample</span><h3>TicTac Tactical Training</h3><p>Two modules use tic-tac-toe strategy to introduce tactical thinking, branching decisions, and leadership reflection.</p><a class=\"text-link\" href=\"https://maddening-silene-a01.notion.site/Sample-Module-Two-TicTac-Tactical-Training-1fc421d41aed81a6bdf0f50f24ea7ee7\" rel=\"noopener noreferrer\" target=\"_blank\">Read Module Two ↗</a><details><summary>Design approach <span aria-hidden=\"true\">+</span></summary><div class=\"detail\"><h4>Turn a familiar game into deliberate practice</h4><p>Module One introduces strategy with branching and media. Module Two uses a Sargent Mosely simulation with aggressive, defensive, and neutral choices, adaptive feedback, and reflection.</p><a class=\"text-link\" href=\"https://maddening-silene-a01.notion.site/Sample-Module-One-TicTac-Tactical-Training-1fc421d41aed81ebb9eed761133b2d4d\" rel=\"noopener noreferrer\" target=\"_blank\">Read Module One ↗</a></div></details></div></article><article class=\"project\" data-category=\"interactive\"><div class=\"project-cover measurement\"><div class=\"cover-meta\"><span>APP ONBOARDING</span><span>06</span></div><h3>From introduction to action.</h3><p class=\"project-tools\">Articulate Storyline · Guided practice</p><p class=\"cover-footer\">MICROLEARNING · DIGITAL ADOPTION</p></div><div class=\"project-copy\"><span class=\"tag\">Portfolio sample</span><h3>Getting started with the Newrez app</h3><p>A mobile app onboarding concept that combines short explanations, click-through practice, video, and knowledge checks.</p><a class=\"text-link\" href=\"https://maddening-silene-a01.notion.site/Sample-Module-One-Getting-Started-with-the-Newrez-App-1ff421d41aed80dc8024d1def9dc98e4\" rel=\"noopener noreferrer\" target=\"_blank\">Read the project write-up ↗</a><details><summary>Design approach <span aria-hidden=\"true\">+</span></summary><div class=\"detail\"><h4>Focus on the first useful actions</h4><p>Break the app experience into manageable steps, explain the purpose of each action, and provide practice and checks that help learners move toward independent use.</p></div></details></div></article><article class=\"project compact-project\" data-category=\"media\"><span class=\"eyebrow\">PODCAST &amp; MEDIA</span><h3>A Decade of Impact</h3><p>A chapter-based podcast review experience for Million Dollar Teacher Project, with English and Spanish support, feedback capture, and JSON export.</p><a class=\"text-link\" href=\"https://github.com/LorneH12/A_Decade_of_Impact_Podcast\" rel=\"noopener noreferrer\" target=\"_blank\">Explore the podcast project ↗</a></article><article class=\"project compact-project\" data-category=\"interactive\"><span class=\"eyebrow\">MICROLEARNING</span><h3>A five-minute learning experience</h3><p>A 12-slide no-bake cheesecake demonstration that uses visual sequencing, mobile layouts, and keyboard navigation to teach a simple process.</p><a class=\"text-link\" href=\"https://github.com/LorneH12/FiveMinutePresentation\" rel=\"noopener noreferrer\" target=\"_blank\">Explore the presentation ↗</a></article></div></section><section class=\"approach\" id=\"approach\"><div class=\"wrap\"><div class=\"section-heading\"><div><p class=\"eyebrow\">HOW I WORK</p><h2>Clear direction.<br/>Practical support.</h2></div><p>Change becomes real in the day-to-day.<br/>That’s where I focus the work.</p></div><div class=\"approach-grid\"><article><span>01 / UNDERSTAND</span><h3>Start with the people.</h3><p>Understand who is affected, what their work looks like, and what might get in the way.</p></article><article><span>02 / ENABLE</span><h3>Connect the dots.</h3><p>Translate the change into clear communication, relevant learning, and practical resources.</p></article><article><span>03 / LEARN</span><h3>Let evidence guide.</h3><p>Use feedback and training data to identify gaps, focus support, and strengthen adoption.</p></article></div></div></section>\n<section class=\"experience wrap\" id=\"experience\"><div class=\"section-heading\"><div><p class=\"eyebrow\">CAREER &amp; EXPERIENCE</p><h2>A career connecting<br/>people and performance.</h2></div><p>Enterprise change, instructional design, training operations, and cross-functional delivery.</p></div><article class=\"career-row\"><p class=\"eyebrow\">JAN 2026 — PRESENT</p><div><h3>American Express</h3><h4>Change Management &amp; Training Analytics</h4><p>Partner with cross-functional teams on enterprise technology change, including Jira and Rally to Jira Cloud, Confluence Cloud, data center transfer, SAP Fieldglass, and AI socialization. Personally develop training videos and PowerPoint decks, host live sessions, and own analytics and communication of findings to stakeholders and executives across these initiatives. Shape messaging with communications partners and support resource management, with delivery scope tailored to each project.</p></div></article><article class=\"career-row\"><p class=\"eyebrow\">2023 — PRESENT</p><div><h3>LAJH Endeavors</h3><h4>Founder · Change &amp; Training Consultant</h4><p>Partner with organizations to assess learning needs, identify adoption barriers, standardize training processes, and design practical job aids and learning experiences. Support stakeholder alignment, project delivery, and workforce readiness.</p></div></article><article class=\"career-row\"><p class=\"eyebrow\">AUG 2017 — MAR 2023</p><div><h3>Charles Schwab</h3><h4>Product &amp; Project Management · Senior Instructional Design</h4><p>Progressed through learning, project, and product responsibilities. Developed digital learning journeys and SharePoint learning hubs, partnered with enterprise IT and business teams, and led cross-functional contributors to support onboarding and organizational change.</p></div></article><article class=\"career-row\"><p class=\"eyebrow\">2014 — 2017</p><div><h3>Concentrix</h3><h4>Training &amp; Quality Management · Instructional Design</h4><p>Led training and quality initiatives across client programs, including Intuit, Amazon, Apple, Nike, and Verizon. Supported a Nike seasonal ramp of 500 employees in three months, and connected learning design with operational performance and quality feedback.</p></div></article><article class=\"career-row\"><p class=\"eyebrow\">AUG 2008 — MAR 2014</p><div><h3>Gatestone</h3><h4>Corporate Training · Instructional Design</h4><p>Delivered customer service and compliance training for American Express and USAA departments. Used role-playing, structured shadowing, call calibration, and gap analysis to support performance. Recipient of the Power of Blue award.</p></div></article></section><section class=\"about wrap\" id=\"about\"><figure c div><p class=\"eyebrow\">THE PERSON BEHIND THE WORK</p><h2>People-centered.<br/><em>Evidence-informed.</em></h2></div><div class=\"about-copy\"><p class=\"large\">I help teams understand new technology, build practical skills, and put new ways of working into practice.</p><p>My experience connects organizational change management (OCM), digital adoption, role-based training, and stakeholder engagement. At American Express, I contribute to enterprise cloud migrations and AI socialization while personally delivering learning content, hosting live sessions, and owning analytics and communication of findings. My background in communications and psychology informs how I translate complex changes for different audiences.</p><div class=\"education\"><span class=\"eyebrow\">CORE CAPABILITIES</span><h3>Change, enablement, and insight</h3><p>Organizational change management · Enterprise technology adoption · Role-based enablement · Change communications · Stakeholder engagement · Executive reporting · Virtual facilitation · Training analytics · Cross-functional collaboration</p><h3>AI adoption and workflow enablement</h3><p>AI socialization across Rovo, Copilot, ChatGPT, and Claude, with a focus on plugins and streamlining work. Training videos, PowerPoint decks, and live learning help make emerging tools understandable and useful.</p></div><div class=\"education\"><span class=\"eyebrow\">EDUCATION</span><h3>University of Arizona</h3><p>BA, Social &amp; Behavioral Sciences<br/>Communications major · Psychology minor</p></div><div class=\"education\"><span class=\"eyebrow\">CERTIFICATIONS &amp; TOOLS</span><h3>Learning design, delivery, and measurement</h3><p>ATD E-Learning Instructional Design · Adobe Captivate</p><p>Articulate 360 / Storyline / Rise · Camtasia · Adobe Creative Cloud · Workday · Cornerstone · SharePoint · Teams · Webex · Slack · PowerPoint · Jira · Confluence · SAP Fieldglass · Rovo · Copilot · ChatGPT · Claude</p></div><div class=\"interest\"><span>PROFESSIO function showDesign(name){const doc=new DOMParser().parseFromString(source,'text/html');const style=doc.createElement('style');style.textContent=themes[name];doc.head.append(style);const anchorFix=doc.createElement('script');anchorFix.textContent="document.addEventListener('click',function(e){const a=e.target.closest('a[href^=\"#\"]');if(!a)return;const id=a.getAttribute('href').slice(1);const target=id?document.getElementById(id):document.body;if(target){e.preventDefault();target.scrollIntoView({behavior:'smooth'});}});";doc.body.append(anchorFix);const main=doc.querySelector('main');const work=doc.querySelector('#work');const impact=doc.querySelector('.impact');const experience=doc.querySelector('#experience');const about=doc.querySelector('#about');const approach=doc.querySelector('#approach');if(name==='executive')main.insertBefore(experience,work);if(name==='editorial')main.insertBefore(work,impact);if(name==='human'){main.insertBefore(approach,work);doc.querySelector('.hero-portrait img').src=navy;doc.querySelector('.hero-portrait img').alt='Lorne Hopkins wearing a navy suit';doc.querySelector('.about-portrait').remove();about.classList.add('no-portrait');}document.querySelector('#preview').srcdoc='<!doctype html>'+doc.documentElement.outerHTML;document.querySelector('#description').textContent=descriptions[name];document.querySelectorAll('[data-design]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.design===name)));history.replaceState(null,'','#'+name);}
document.querySelectorAll('[data-design]').forEach(b=>b.addEventListener('click',()=>showDesign(b.dataset.design)));document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{document.querySelector('#preview').classList.toggle('phone',b.dataset.size==='phone');document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}));const initial=location.hash.slice(1);showDesign(themes[initial]?initial:'executive');
