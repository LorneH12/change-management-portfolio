href^=\"#\"]')];const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){links.forEach(a=>{if(a.hash==='#'+entry.target.id)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});}});},{rootMargin:'-15% 0px -60% 0px'});links.forEach(a=>{const section=document.querySelector(a.hash);if(section)observer.observe(section);});}\n});<\/script><\/head>\n<body>\n<a class=\"skip\" href=\"#main\">Skip to content<\/a>\n<header class=\"header\"><a aria-label=\"Lorne Hopkins home\" class=\"brand\" href=\"#\"><span class=\"monogram\">LH<span>.<\/span><\/span><span>LORNE HOPKINS<\/span><\/a><button aria-controls=\"main-nav\" aria-expanded=\"false\" class=\"menu-toggle\" hidden=\"\" type=\"button\">Menu<\/button><nav aria-label=\"Main navigation\" id=\"main-nav\"><a href=\"#work\">Selected work<\/a><a href=\"#experience\">Experience<\/a><a href=\"#about\">About<\/a><a href=\"#contact\">Contact<\/a><button aria-pressed=\"false\" class=\"theme-toggle\" hidden=\"\" type=\"button\">Dark mode<\/button><\/nav><\/header>\n<main id=\"main\">\n<section class=\"hero wrap\"><div class=\"hero-copy\"><p class=\"eyebrow\"><span class=\"rule\"><\/span> CHANGE MANAGEMENT + TRAINING ENABLEMENT<\/p><h1>Change starts<br/>with <em>people.<\/em><\/h1><p class=\"intro\">I\u2019m Lorne Hopkins, a Change Management and Training Analyst with 15+ years across enterprise learning, operations, and workforce enablement. I help people understand change, build confidence, and put new ways of working into practice.<\/p><a class=\"button\" href=\"#work\">Explore my work <span aria-hidden=\"true\">\u2198<\/span><\/a><div class=\"hero-meta\"><span>Based in Phoenix, Arizona<\/span><span>People. Learning. Adoption.<\/span><\/div><\/div>\n<aside aria-label=\"My focus: from change to adoption\" class=\"framework\"><div class=\"framework-top\"><span>THE PEOPLE SIDE OF PROGRESS<\/span><span>01 / 03<\/span><\/div><div class=\"framework-title\">A new system.<br/>A human transition.<\/div><div class=\"path\"><div><span class=\"step\">01<\/span><p><strong>Make it clear.<\/strong><span>Understand what\u2019s changing and why.<\/span><\/p><\/div><div><span class=\"step\">02<\/span><p><strong>Make it practical.<\/strong><span>Build confidence through relevant learning.<\/span><\/p><\/div><div><span class=\"step\">03<\/span><p><strong>Make it stick.<\/strong><span>Listen, measure, and reinforce adoption.<\/span><\/p><\/div><\/div><div class=\"framework-bottom\">STRATEGY \u2192 ENABLEMENT \u2192 ADOPTION<\/div><\/aside><\/section>\n<div class=\"focus-strip\"><div class=\"wrap\"><span>Change readiness<\/span><b aria-hidden=\"true\">/<\/b><span>Stakeholder engagement<\/span><b aria-hidden=\"true\">/<\/b><span>Learning strategy<\/span><b aria-hidden=\"true\">/<\/b><span>Training analytics<\/span><\/div><\/div>\n<section aria-label=\"Enterprise training scope\" class=\"impact wrap\"><div><strong>60,000<\/strong><span>Learners in the impacted audience<\/span><\/div><div><strong>60+<\/strong><span>Live training sessions coordinated<\/span><\/div><div><strong>7 personas<\/strong><span>Across five training phases<\/span><\/div><p>American Express \u00b7 Enterprise change and training logistics<\/p><\/section>\n<section class=\"work wrap\" id=\"work\"><div class=\"section-heading\"><div><p class=\"eyebrow\">01 \u2014 SELECTED WORK<\/p><h2>Learning designed<br/>for real work.<\/h2><\/div><p>Explore learning journeys, interactive demonstrations, and scenario-based modules. Sample builds show my design approach; they are not presented as commissioned client deployments.<\/p><\/div><div class=\"project-controls\" hidden=\"\"><div aria-label=\"Filter work samples\" class=\"filter-buttons\" role=\"group\"><button aria-pressed=\"true\" data-filter=\"all\" type=\"button\">All work<\/button><button aria-pressed=\"false\" data-filter=\"strategy\" type=\"button\">Learning strategy<\/button><button aria-pressed=\"false\" data-filter=\"interactive\" type=\"button\">Interactive learning<\/button><button aria-pressed=\"false\" data-filter=\"media\" type=\"button\">Video &amp; media<\/button><\/div><p aria-live=\"polite\" id=\"project-count\" role=\"status\">8 projects<\/p><\/div><div class=\"project-grid\" id=\"project-grid\"><article class=\"project\" data-category=\"strategy\"><div class=\"project-cover rollout\"><div class=\"cover-meta\"><span>FEATURED CASE STUDY<\/span><span>01<\/span><\/div><h3>From a binder to a learning journey.<\/h3><p class=\"project-tools\">ADDIE, SAM, Bloom\u2019s taxonomy, Kirkpatrick, Articulate, Cornerstone<\/p><p class=\"cover-footer\">LEARNING STRATEGY \u00b7 INSTRUCTIONAL DESIGN<\/p><\/div><div class=\"project-copy\"><span class=\"tag\">Case study<\/span><h3>Schwab learning journey<\/h3><p>A digital onboarding case study that restructures a 200+ page training binder into role-based learning and ongoing performance support.<\/p><a class=\"text-link\" href=\"https://github.com/LorneH12/Schwab-Learning-Journey\" rel=\"noopener noreferrer\" target=\"_blank\">Read the case study \u2197<\/a><details><summary>Design approach <span aria-hidden=\"true\">+<\/span><\/summary><div class=\"detail\"><h4>Understand the work<\/h4><p>Organize learning around role-specific tasks, sequence practice and reference materials, and plan reinforcement at 30, 60, and 90 days. The case study connects learning design with readiness and application on the job.<\/p><\/div><\/details><\/div><\/article><article class=\"project\" data-category=\"interactive\"><div class=\"project-cover measurement\"><div class=\"cover-meta\"><span>INTERACTIVE SAMPLE<\/span><span>02<\/span><\/div><h3>Make complex processes usable.<\/h3><p class=\"project-tools\">Multilingual delivery, progress tracking, workflow navigation<\/p><p class=\"cover-footer\">OPERATIONAL TRAINING \u00b7 PERFORMANCE SUPPORT<\/p><\/div><div class=\"project-copy\"><span class=\"tag\">Portfolio sample<\/span><h3>Carvana inspection training<\/h3><p>A sample learning experience inspired by the 150-point vehicle inspection process, covering standards, reconditioning flow, quality, and safety.<\/p><a class=\"text-link\" href=\"https://lorneh12.github.io/carvana-150point-inspection/\" rel=\"noopener noreferrer\" target=\"_blank\">Launch training sample \u2197<\/a><details><summary>Design approach <span aria-hidden=\"true\">+<\/span><\/summary><div class=\"detail\"><h4>Design for the moment of need<\/h4><p>Connect inspection standards to the workflow, provide clear navigation, and support English, Spanish, and Mandarin audiences. This is a representative capability sample.<\/p><\/div><\/details><\/div><\/article><article class=\"project\" data-category=\"interactive\"><div class=\"project-cover rollout\"><div class=\"cover-meta\"><span>INTERACTIVE SAMPLE<\/span><span>03<\/span><\/div><h3>Build confidence, step by step.<\/h3><p class=\"project-tools\">English, Spanish, Mandarin, Hindi \u00b7 Knowledge checks<\/p><p class=\"cover-footer\">CUSTOMER EDUCATION \u00b7 ACCESSIBLE LEARNING<\/p><\/div><div class=\"project-copy\"><span class=\"tag\">Portfolio sample<\/span><h3>Intuit TurboTax customer training<\/h3><p>A customer education demonstration with guided objectives, product benefits, knowledge checks, and a completion experience.<\/p><a class=\"text-link\" href=\"https://lorneh12.github.io/Intuit-TurboTax-Customer_-Training/\" rel=\"noopener noreferrer\" target=\"_blank\">Launch training sample \u2197<\/a><details><summary>Design approach <span aria-hidden=\"true\">+<\/span><\/summary><div class=\"detail\"><h4>Reduce the learning barrier<\/h4><p>Introduce the purpose of the tool, guide learners through essential concepts, and check understanding before completion. Language choices and a structured flow support a broad audience.<\/p><\/div><\/details><\/div><\/article><article class=\"project\" data-category=\"media\"><div class=\"project-cover measurement\"><div class=\"cover-meta\"><span>VIDEO LEARNING<\/span><span>04<\/span><\/div><h3>A practical library of learning.<\/h3><p class=\"project-tools\">English, French, Spanish, Arabic \u00b7 Analytics dashboard structure<\/p><p class=\"cover-footer\">VIDEO LEARNING \u00b7 LEARNING EXPERIENCE DESIGN<\/p><\/div><div class=\"project-copy\"><span class=\"tag\">Portfolio sample<\/span><h3>Schwab video training samples<\/h3><p>A collection of 13 configured video entries in a multilingual learning interface with light and dark display options.<\/p><a class=\"text-link\" href=\"https://github.com/LorneH12/Schwab-Video-Training-Samples\" rel=\"noopener noreferrer\" target=\"_blank\">Explore the video project \u2197<\/a><details><summary>Design approach <span aria-hidden=\"true\">+<\/span><\/summary><div class=\"detail\"><h4>Make learning easy to revisit<\/h4><p>Bring video resources into an organized experience that helps learners return to material when they need it. The build includes a structure for tracking engagement through a dashboard and Google Sheets.<\/p><\/div><\/details><\/div><\/article><article class=\"project\" data-category=\"interactive\"><div class=\"project-cover rollout\"><div class=\"cover-meta\"><span>SCENARIO-BASED LEARNING<\/span><span>05<\/span><\/div><h3>Practice decisions. See consequences.<\/h3><p class=\"project-tools\">PowerPoint, Articulate Storyline, TalentLMS<\/p><p class=\"cover-footer\">SCENARIO DESIGN \u00b7 ADAPTIVE FEEDBACK<\/p><\/div><div class=\"project-copy\"><span class=\"tag\">Portfolio sample<\/span><h3>TicTac Tactical Training<\/h3><p>Two modules use tic-tac-toe strategy to introduce tactical thinking, branching decisions, and leadership reflection.<\/p><a class=\"text-link\" href=\"https://maddening-silene-a01.notion.site/Sample-Module-Two-TicTac-Tactical-Training-1fc421d41aed81a6bdf0f50f24ea7ee7\" rel=\"noopener noreferrer\" target=\"_blank\">Read Module Two \u2197<\/a><details><summary>Design approach <span aria-hidden=\"true\">+<\/span><\/summary><div class=\"detail\"><h4>Turn a familiar game into deliberate practice<\/h4><p>Module One introduces strategy with branching and media. Module Two uses a Sargent Mosely simulation with aggressive, defensive, and neutral choices, adaptive feedback, and reflection.<\/p><a class=\"text-link\" href=\"https://maddening-silene-a01.notion.site/Sample-Module-One-TicTac-Tactical-Training-1fc421d41aed81ebb9eed761133b2d4d\" rel=\"noopener noreferrer\" target=\"_blank\">Read Module One \u2197<\/a><\/div><\/details><\/div><\/article><article class=\"project\" data-category=\"interactive\"><div class=\"project-cover measurement\"><div class=\"cover-meta\"><span>APP ONBOARDING<\/span><span>06<\/span><\/div><h3>From introduction to action.<\/h3><p class=\"project-tools\">Articulate Storyline \u00b7 Guided practice<\/p><p class=\"cover-footer\">MICROLEARNING \u00b7 DIGITAL ADOPTION<\/p><\/div><div class=\"project-copy\"><span class=\"tag\">Portfolio sample<\/span><h3>Getting started with the Newrez app<\/h3><p>A mobile app onboarding concept that combines short explanations, click-through practice, video, and knowledge checks.<\/p><a class=\"text-link\" href=\"https://maddening-silene-a01.notion.site/Sample-Module-One-Getting-Started-with-the-Newrez-App-1ff421d41aed80dc8024d1def9dc98e4\" rel=\"noopener noreferrer\" target=\"_blank\">Read the project write-up \u2197<\/a><details><summary>Design approach <span aria-hidden=\"true\">+<\/span><\/summary><div class=\"detail\"><h4>Focus on the first useful actions<\/h4><p>Break the app experience into manageable steps, explain the purpose of each action, and provide practice and checks that help learners move toward independent use.<\/p><\/div><\/details><\/div><\/article><article class=\"project compact-project\" data-category=\"media\"><span class=\"eyebrow\">PODCAST &amp; MEDIA<\/span><h3>A Decade of Impact<\/h3><p>A chapter-based podcast review experience for Million Dollar Teacher Project, with English and Spanish support, feedback capture, and JSON export.<\/p><a class=\"text-link\" href=\"https://github.com/LorneH12/A_Decade_of_Impact_Podcast\" rel=\"noopener noreferrer\" target=\"_blank\">Explore the podcast project \u2197<\/a><\/article><article class=\"project compact-project\" data-category=\"interactive\"><span class=\"eyebrow\">MICROLEARNING<\/span><h3>A five-minute learning experience<\/h3><p>A 12-slide no-bake cheesecake demonstration that uses visual sequencing, mobile layouts, and keyboard navigation to teach a simple process.<\/p><a class=\"text-link\" href=\"https://github.com/LorneH12/FiveMinutePresentation\" rel=\"noopener noreferrer\" target=\"_blank\">Explore the presentation \u2197<\/a><\/article><\/div><\/section><section class=\"approach\" id=\"approach\"><div class=\"wrap\"><div class=\"section-heading\"><div><p class=\"eyebrow\">02 \u2014 MY APPROACH<\/p><h2>Clear direction.<br/>Practical support.<\/h2><\/div><p>Change becomes real in the day-to-day.<br/>That\u2019s where I focus the work.<\/p><\/div><div class=\"approach-grid\"><article><span>01 / UNDERSTAND<\/span><h3>Start with the people.<\/h3><p>Understand who is affected, what their work looks like, and what might get in the way.<\/p><\/article><article><span>02 / ENABLE<\/span><h3>Connect the dots.<\/h3><p>Translate the change into clear communication, relevant learning, and practical resources.<\/p><\/article><article><span>03 / LEARN<\/span><h3>Let evidence guide.<\/h3><p>Use feedback and training data to identify gaps, focus support, and strengthen adoption.<\/p><\/article><\/div><\/div><\/section>\n<section class=\"experience wrap\" id=\"experience\"><div class=\"section-heading\"><div><p class=\"eyebrow\">03 \u2014 EXPERIENCE<\/p><h2>A career connecting<br/>people and performance.<\/h2><\/div><p>Enterprise change, instructional design, training operations, and cross-functional delivery.<\/p><\/div><article class=\"career-row\"><p class=\"eyebrow\">JAN 2026 \u2014 PRESENT<\/p><div><h3>American Express<\/h3><h4>Change Management &amp; Training Logistics<\/h4><p>Coordinate training and enablement for enterprise technology adoption, including Jira Cloud, Confluence Cloud, GitHub, and data center changes. Organize role-based delivery, learning communications, and Webex sessions for audiences of 200\u20131,000 attendees. Develop video and learning resources using Camtasia and AI-assisted tools.<\/p><\/div><\/article><article class=\"career-row\"><p class=\"eyebrow\">2023 \u2014 PRESENT<\/p><div><h3>LAJH Endeavors<\/h3><h4>Founder \u00b7 Change &amp; Training Consultant<\/h4><p>Partner with organizations to assess learning needs, identify adoption barriers, standardize training processes, and design practical job aids and learning experiences. Support stakeholder alignment, project delivery, and workforce readiness.<\/p><\/div><\/article><article class=\"career-row\"><p class=\"eyebrow\">AUG 2017 \u2014 MAR 2023<\/p><div><h3>Charles Schwab<\/h3><h4>Product &amp; Project Management \u00b7 Senior Instructional Design<\/h4><p>Progressed through learning, project, and product responsibilities. Developed digital learning journeys and SharePoint learning hubs, partnered with enterprise IT and business teams, and led cross-functional contributors to support onboarding and organizational change.<\/p><\/div><\/article><article class=\"career-row\"><p class=\"eyebrow\">2014 \u2014 2017<\/p><div><h3>Concentrix<\/h3><h4>Training &amp; Quality Management \u00b7 Instructional Design<\/h4><p>Led training and quality initiatives across client programs, including Intuit, Amazon, Apple, Nike, and Verizon. Supported a Nike seasonal ramp of 500 employees in three months, and connected learning design with operational performance and quality feedback.<\/p><\/div><\/article><article class=\"career-row\"><p class=\"eyebrow\">AUG 2008 \u2014 MAR 2014<\/p><div><h3>Gatestone<\/h3><h4>Corporate Training \u00b7 Instructional Design<\/h4><p>Delivered customer service and compliance training for American Express and USAA departments. Used role-playing, structured shadowing, call calibration, and gap analysis to support performance. Recipient of the Power of Blue award.<\/p><\/div><\/article><\/section><section class=\"about wrap\" id=\"about\"><div><p class=\"eyebrow\">04 \u2014 ABOUT LORNE<\/p><h2>People-centered.<br/><em>Evidence-informed.<\/em><\/h2><\/div><div class=\"about-copy\"><p class=\"large\">My focus is the connection between organizational change, effective learning, and the people doing the work.<\/p><p>I work where technology, process, and human behavior meet. My background spans corporate training, instructional design, quality management, project delivery, and change enablement. Communications and psychology inform how I engage stakeholders, simplify complex ideas, and design learning people can use.<\/p><div class=\"education\"><span class=\"eyebrow\">EDUCATION<\/span><h3>University of Arizona<\/h3><p>BA, Social &amp; Behavioral Sciences<br/>Communications major \u00b7 Psychology minor<\/p><\/div><div class=\"education\"><span class=\"eyebrow\">CERTIFICATIONS &amp; TOOLS<\/span><h3>Learning design, delivery, and measurement<\/h3><p>ATD E-Learning Instructional Design \u00b7 Adobe Captivate<\/p><p>Articulate 360 / Storyline / Rise \u00b7 Camtasia \u00b7 Adobe Creative Cloud \u00b7 Workday \u00b7 Cornerstone \u00b7 SharePoint \u00b7 Teams \u00b7 Webex \u00b7 Jira \u00b7 Confluence<\/p><\/div><div class=\"interest\"><span>PROFESSIONAL FOCUS<\/span><p>Change Manager &amp; Training Analyst opportunities<\/p><\/div><\/div><\/section>\n<section class=\"contact\" id=\"contact\"><div class=\"wrap\"><p class=\"eyebrow\">LET\u2019S CONNECT<\/p><h2>Help people move<br/>forward with confidence.<\/h2><p>Let\u2019s talk about change management, training strategy, and learning experiences that support your team.<\/p><div class=\"contact-links\"><a class=\"button\" href=\"mailto:LorneH12@gmail.com\">Email Lorne \u2197<\/a><a href=\"https://www.linkedin.com/in/lorne-hopkins\" rel=\"noopener noreferrer\" target=\"_blank\">LinkedIn \u2197<\/a><a href=\"https://github.com/LorneH12\" rel=\"noopener noreferrer\" target=\"_blank\">GitHub \u2197<\/a><a href=\"https://maddening-silene-a01.notion.site/Projects-1fc421d41aed810b910edad8d6c45aff\" rel=\"noopener noreferrer\" target=\"_blank\">Notion portfolio \u2197<\/a><\/div><\/div><\/section><\/main><footer class=\"wrap\"><a class=\"brand\" href=\"#\"><span class=\"monogram\">LH<span>.<\/span><\/span><span>LORNE HOPKINS<\/span><\/a><p>Change Management + Training Analytics<\/p><a href=\"#main\">Back to top \u2191<\/a><\/footer>\n<\/body><\/html>\n";
